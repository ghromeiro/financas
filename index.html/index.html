<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romeiro Finance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f3fff'/%3E%3Ctext x='50' y='66' font-size='48' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3Eri%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--bg:#f4f6fb;--ink:#12141a;--muted:#677084;--line:#e3e7ef;--blue:#1f3fff;--in:#0f8a5f;--out:#c2410c;--font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--paper);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.9rem}
nav{display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--blue);color:#fff}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.foot button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem}
.foot button:hover{background:var(--bg);color:var(--ink)}
.foot .danger:hover{color:var(--out)}
main{padding:24px clamp(16px,3vw,36px) 56px;max-width:1100px;width:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.month{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.month button{border:0;background:none;width:36px;height:36px;border-radius:8px;font-size:1.2rem}
.month button:hover{background:var(--bg)}
.month strong{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;min-height:44px}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line)}
.btn:hover{filter:brightness(.94)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:.95rem;font-weight:600;margin:0 0 14px}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:28px;margin-bottom:16px}
.hero small{opacity:.8}
.hero .big{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:.85rem}
.kpi .v{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.kpi .d{color:var(--muted);font-size:.8rem}
.in{color:var(--in)}.out{color:var(--out)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
svg{display:block;width:100%;height:auto}
.bars g{cursor:pointer}.bars g:hover rect{opacity:1!important}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;flex:none}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:150px}
.leg button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:5px 0;text-align:left;font-size:.88rem}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{margin-left:auto;color:var(--muted)}
.leg button:hover{color:var(--blue)}
.muted{color:var(--muted);font-size:.9rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select,dialog input,dialog select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:44px;width:100%}
.tools input{flex:2 1 200px}.tools select{flex:1 1 140px;width:auto}
input:focus,select:focus{border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.82rem;display:flex;align-items:center;gap:6px}
.row .m i{width:8px;height:8px;border-radius:50%}
.row .a{font-weight:600;text-align:right;white-space:nowrap}
.row .x{grid-column:2;justify-self:end}
.link{background:none;border:0;color:var(--blue);font-size:.82rem;padding:6px 8px;border-radius:6px}
.link.d{color:var(--out)}
.meta{display:grid;grid-template-columns:1fr 130px;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.meta:last-child{border:0}
.bar{grid-column:1/-1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px}
.meta .s{font-size:.82rem;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:24px;width:min(440px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(18,20,26,.45)}
dialog h2{margin:0 0 16px;font-size:1.1rem}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:.82rem;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{padding:11px;text-align:center;cursor:pointer;font-size:.92rem}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--blue);outline-offset:-3px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:.9rem;z-index:9}
#toast button{background:none;border:0;color:#9db0ff;font-weight:600}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}nav{flex-direction:row}.foot{margin:0;flex-direction:row;flex-wrap:wrap;width:100%}.kpis,.two{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.btn,nav button{transition:filter .15s,background .15s}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="logo">ri</span>Romeiro Finance</div>
  <nav id="nav">
    <button data-v="geral" class="on">Visão geral</button>
    <button data-v="lanc">Lançamentos</button>
    <button data-v="metas">Metas</button>
  </nav>
  <div class="foot">
    <button id="bDemo">Carregar dados de exemplo</button>
    <button id="bCsv">Exportar planilha (CSV)</button>
    <button id="bClear" class="danger">Apagar todos os dados</button>
  </div>
</aside>
<main>
  <header>
    <div class="month"><button id="mPrev" aria-label="Mês anterior">‹</button><strong id="mLabel"></strong><button id="mNext" aria-label="Próximo mês">›</button></div>
    <button class="btn primary" id="bNovo">Novo lançamento</button>
  </header>

  <section id="v-geral">
    <div class="hero"><small>Saldo do mês</small><div class="big" id="hSaldo">R$ 0,00</div><small id="hSub"></small></div>
    <div class="kpis" id="kpis"></div>
    <div class="two">
      <div class="card"><h2>Entradas e saídas nos últimos 6 meses</h2><div id="bars"></div><p class="muted" style="margin:8px 0 0">Clique em um mês para abri-lo.</p></div>
      <div class="card"><h2>Saídas por categoria</h2><div id="donut"></div></div>
    </div>
  </section>

  <section id="v-lanc" hidden>
    <div class="card">
      <div class="tools">
        <input id="fQ" type="search" placeholder="Buscar por descrição" aria-label="Buscar por descrição">
        <select id="fTipo" aria-label="Tipo"><option value="">Todos os tipos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option></select>
        <select id="fCat" aria-label="Categoria"></select>
      </div>
      <div id="lista"></div>
    </div>
  </section>

  <section id="v-metas" hidden>
    <div class="card"><h2>Limite de gastos por categoria neste mês</h2><p class="muted" style="margin-top:-6px">Defina um valor e acompanhe o quanto já foi usado.</p><div id="metas"></div></div>
  </section>
</main>
</div>

<dialog id="dlg">
  <form id="form" autocomplete="off">
    <h2 id="dTitulo">Novo lançamento</h2>
    <div class="seg" role="radiogroup" aria-label="Tipo">
      <input type="radio" name="tipo" id="tS" value="saida" checked><label for="tS">Saída</label>
      <input type="radio" name="tipo" id="tE" value="entrada"><label for="tE">Entrada</label>
    </div>
    <div class="g2">
      <div class="f"><label for="fVal">Valor (R$)</label><input id="fVal" type="number" step="0.01" min="0.01" inputmode="decimal" required></div>
      <div class="f"><label for="fData">Data</label><input id="fData" type="date" required></div>
    </div>
    <div class="f"><label for="fDesc">Descrição</label><input id="fDesc" maxlength="80" required placeholder="Ex.: compras do mês"></div>
    <div class="f"><label for="fCt">Categoria</label><select id="fCt"></select></div>
    <div class="acts"><button type="button" class="btn ghost" id="dCancel">Cancelar</button><button class="btn primary" id="dSalvar">Adicionar</button></div>
  </form>
</dialog>
<div id="toast" hidden></div>

<script>
(function(){
var CATS={'Mercado':'#1f3fff','Transporte':'#0ea5e9','Lazer':'#8b5cf6','Contas fixas':'#f59e0b','Renda':'#0f8a5f','Outros':'#94a3b8'};
var $=function(s){return document.querySelector(s)};
var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function pad(n){return String(n).padStart(2,'0')}
function hoje(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addM(m,n){var p=m.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function mDate(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fdata(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

function load(){try{var d=JSON.parse(localStorage.getItem('financas:v2'));if(d&&Array.isArray(d.items))return d;
  var o=JSON.parse(localStorage.getItem('financas:v1'));if(Array.isArray(o))return{items:o.map(function(i){i.id=String(i.id);return i}),metas:{}}}catch(e){}
  return{items:[],metas:{}}}
function save(){try{localStorage.setItem('financas:v2',JSON.stringify(S))}catch(e){}}
var S=load(),mes=hoje().slice(0,7),view='geral',F={q:'',tipo:'',cat:''},editId=null,lastDel=null,tmr;

function sums(m){var r={e:0,s:0,by:{}};S.items.forEach(function(i){if(i.data.slice(0,7)!==m)return;
  if(i.tipo==='entrada')r.e+=i.valor;else{r.s+=i.valor;r.by[i.cat]=(r.by[i.cat]||0)+i.valor}});return r}
function cnt(el,v){if(reduce){el.textContent=brl.format(v);return}var t0=performance.now();
  (function f(t){var p=Math.min(1,(t-t0)/550);el.textContent=brl.format(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function delta(c,p){if(!p)return'Sem dados no mês anterior';var x=(c-p)/p*100;return(x>=0?'▲ ':'▼ ')+Math.abs(x).toFixed(0)+'% vs mês anterior'}

function geral(){
  var c=sums(mes),p=sums(addM(mes,-1)),saldo=c.e-c.s;
  cnt($('#hSaldo'),saldo);
  $('#hSub').textContent=saldo>=0?'Você está no azul neste mês.':'As saídas passaram das entradas neste mês.';
  var taxa=c.e>0?Math.round(saldo/c.e*100)+'%':'—';
  $('#kpis').innerHTML=
   '<div class="card kpi"><div class="l">Entradas</div><div class="v in" id="kE"></div><div class="d">'+delta(c.e,p.e)+'</div></div>'+
   '<div class="card kpi"><div class="l">Saídas</div><div class="v out" id="kS"></div><div class="d">'+delta(c.s,p.s)+'</div></div>'+
   '<div class="card kpi"><div class="l">Taxa de poupança</div><div class="v">'+taxa+'</div><div class="d">Quanto das entradas sobrou</div></div>';
  cnt($('#kE'),c.e);cnt($('#kS'),c.s);
  var ms=[-5,-4,-3,-2,-1,0].map(function(n){return addM(mes,n)}),ds=ms.map(sums);
  var mx=Math.max.apply(null,[1].concat(ds.map(function(d){return Math.max(d.e,d.s)}))),h='';
  ms.forEach(function(m,i){var d=ds[i],x=30+i*92,he=d.e/mx*160,hs=d.s/mx*160,o=m===mes?1:.45,lb=mDate(m).toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    h+='<g data-m="'+m+'" tabindex="0" role="button" aria-label="'+lb+': entradas '+brl.format(d.e)+', saídas '+brl.format(d.s)+'"><title>'+lb+': entradas '+brl.format(d.e)+' | saídas '+brl.format(d.s)+'</title>'+
    '<rect x="'+x+'" y="'+(185-he)+'" width="26" height="'+he+'" rx="4" fill="#0f8a5f" opacity="'+o+'"/>'+
    '<rect x="'+(x+30)+'" y="'+(185-hs)+'" width="26" height="'+hs+'" rx="4" fill="#c2410c" opacity="'+o+'"/>'+
    '<text x="'+(x+28)+'" y="206" font-size="12" text-anchor="middle" fill="#677084">'+lb+'</text></g>'});
  $('#bars').innerHTML='<svg class="bars" viewBox="0 0 600 215" role="img" aria-label="Gráfico de barras">'+h+'</svg>';
  var cats=Object.keys(c.by).sort(function(a,b){return c.by[b]-c.by[a]});
  if(!cats.length){$('#donut').innerHTML='<p class="muted">Nenhuma saída neste mês.</p>';return}
  var C=2*Math.PI*60,off=0,seg='',lg='';
  cats.forEach(function(k){var l=c.by[k]/c.s*C;
    seg+='<circle cx="80" cy="80" r="60" fill="none" stroke="'+(CATS[k]||'#94a3b8')+'" stroke-width="22" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)"/>';off+=l;
    lg+='<li><button data-cat="'+esc(k)+'"><i style="background:'+(CATS[k]||'#94a3b8')+'"></i>'+esc(k)+'<span>'+Math.round(c.by[k]/c.s*100)+'%</span></button></li>'});
  $('#donut').innerHTML='<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Saídas por categoria">'+seg+'<text x="80" y="78" text-anchor="middle" font-size="10" fill="#677084">Saídas</text><text x="80" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#12141a">'+brl.format(c.s)+'</text></svg><ul class="leg">'+lg+'</ul></div>';
}

function lanc(){
  var q=F.q.toLowerCase(),l=S.items.filter(function(i){return i.data.slice(0,7)===mes&&(!F.tipo||i.tipo===F.tipo)&&(!F.cat||i.cat===F.cat)&&(!q||i.desc.toLowerCase().indexOf(q)>-1)})
   .sort(function(a,b){return b.data.localeCompare(a.data)});
  $('#lista').innerHTML=l.length?l.map(function(i){return'<div class="row"><div><div class="t">'+esc(i.desc)+'</div><div class="m"><i style="background:'+(CATS[i.cat]||'#94a3b8')+'"></i>'+esc(i.cat)+', '+fdata(i.data)+'</div></div>'+
   '<div class="a '+(i.tipo==='entrada'?'in':'out')+'">'+(i.tipo==='entrada'?'+ ':'− ')+brl.format(i.valor)+'</div><div class="x"><button class="link" data-edit="'+i.id+'">Editar</button><button class="link d" data-del="'+i.id+'">Apagar</button></div></div>'}).join(''):
   '<p class="muted">Nenhum lançamento neste filtro. Use “Novo lançamento” para adicionar.</p>';
}

function metas(){
  var c=sums(mes);
  $('#metas').innerHTML=Object.keys(CATS).filter(function(k){return k!=='Renda'}).map(function(k){
    var u=c.by[k]||0,lim=S.metas[k]||0,pc=lim?u/lim*100:0,cor=pc>100?'#c2410c':(CATS[k]||'#94a3b8'),
    st=!lim?'Sem limite definido':pc>100?'Passou '+brl.format(u-lim)+' do limite':pc>=80?'Perto do limite: '+Math.round(pc)+'% usado':Math.round(pc)+'% usado';
    return'<div class="meta"><div><strong>'+esc(k)+'</strong><div class="s">'+brl.format(u)+(lim?' de '+brl.format(lim):'')+' · '+st+'</div></div>'+
     '<input type="number" min="0" step="10" inputmode="decimal" data-meta="'+esc(k)+'" value="'+(lim||'')+'" placeholder="Limite" aria-label="Limite de '+esc(k)+'">'+
     '<div class="bar"><b style="width:'+Math.min(100,pc)+'%;background:'+cor+'"></b></div></div>'}).join('');
}

function R(){
  $('#mLabel').textContent=mDate(mes).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  ['geral','lanc','metas'].forEach(function(v){$('#v-'+v).hidden=v!==view});
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  if(view==='geral')geral();else if(view==='lanc')lanc();else metas();
}
function go(v){view=v;R()}

function toast(msg,undo){var t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>';
  if(undo){var b=document.createElement('button');b.textContent='Desfazer';b.onclick=function(){undo();t.hidden=true};t.appendChild(b)}
  t.hidden=false;clearTimeout(tmr);tmr=setTimeout(function(){t.hidden=true},5000)}

function openD(id){
  editId=id||null;var i=id&&S.items.filter(function(x){return x.id===id})[0];
  $('#dTitulo').textContent=i?'Editar lançamento':'Novo lançamento';$('#dSalvar').textContent=i?'Salvar alterações':'Adicionar';
  $('#fVal').value=i?i.valor:'';$('#fDesc').value=i?i.desc:'';$('#fCt').value=i?i.cat:'Mercado';
  $('#fData').value=i?i.data:(mes===hoje().slice(0,7)?hoje():mes+'-01');
  (i&&i.tipo==='entrada'?$('#tE'):$('#tS')).checked=true;
  $('#dlg').showModal();$('#fVal').focus();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-v],[data-m],[data-cat],[data-edit],[data-del]');if(!t)return;
  var d=t.dataset;
  if(d.v)go(d.v);
  else if(d.m){mes=d.m;R()}
  else if(d.cat){F={q:'',tipo:'saida',cat:d.cat};$('#fQ').value='';$('#fTipo').value='saida';$('#fCat').value=d.cat;go('lanc')}
  else if(d.edit)openD(d.edit);
  else if(d.del){var i=S.items.filter(function(x){return x.id===d.del})[0];if(!i)return;
    S.items=S.items.filter(function(x){return x.id!==d.del});save();R();
    toast('Lançamento apagado.',function(){S.items.push(i);save();R()})}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-m]')){e.preventDefault();mes=e.target.dataset.m;R()}});
$('#mPrev').onclick=function(){mes=addM(mes,-1);R()};
$('#mNext').onclick=function(){mes=addM(mes,1);R()};
$('#bNovo').onclick=function(){openD()};
$('#dCancel').onclick=function(){$('#dlg').close()};
$('#fQ').oninput=function(){F.q=this.value;lanc()};
$('#fTipo').onchange=function(){F.tipo=this.value;lanc()};
$('#fCat').onchange=function(){F.cat=this.value;lanc()};
$('#metas').addEventListener('change',function(e){var k=e.target.dataset.meta;if(!k)return;S.metas[k]=Math.max(0,parseFloat(e.target.value)||0);save();metas()});

$('#form').addEventListener('submit',function(e){
  e.preventDefault();var v=Math.round(parseFloat($('#fVal').value)*100)/100,desc=$('#fDesc').value.trim(),dt=$('#fData').value;
  if(!(v>0)||!desc||!dt)return;
  var o={tipo:document.querySelector('input[name="tipo"]:checked').value,valor:v,data:dt,desc:desc,cat:$('#fCt').value};
  if(editId){S.items=S.items.map(function(x){return x.id===editId?Object.assign({},o,{id:x.id}):x})}
  else{o.id=uid();S.items.push(o)}
  mes=dt.slice(0,7);F={q:'',tipo:'',cat:''};$('#fQ').value='';$('#fTipo').value='';$('#fCat').value='';
  save();$('#dlg').close();R();toast(editId?'Alterações salvas.':'Lançamento adicionado.');
});

$('#bCsv').onclick=function(){
  if(!S.items.length){toast('Não há lançamentos para exportar.');return}
  var rows=['Data;Tipo;Categoria;Descrição;Valor'].concat(S.items.slice().sort(function(a,b){return a.data.localeCompare(b.data)}).map(function(i){
    return[fdata(i.data),i.tipo==='entrada'?'Entrada':'Saída',i.cat,'"'+i.desc.replace(/"/g,'""')+'"',String(i.valor).replace('.',',')].join(';')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='financas.csv';document.body.appendChild(a);a.click();a.remove();
};
$('#bClear').onclick=function(){if(confirm('Apagar todos os lançamentos e metas? Esta ação não pode ser desfeita.')){S={items:[],metas:{}};save();R();toast('Dados apagados.')}};
$('#bDemo').onclick=function(){
  if(S.items.length&&!confirm('Adicionar dados de exemplo aos seus lançamentos atuais?'))return;
  var T=[[5,'entrada','Renda','Projeto de site, cliente A',2500],[18,'entrada','Renda','Manutenção de site',900],[2,'saida','Contas fixas','Aluguel',1100],[3,'saida','Contas fixas','Internet',100],
   [6,'saida','Mercado','Compras da semana',280],[14,'saida','Mercado','Feira e padaria',160],[20,'saida','Mercado','Compras do mês',340],[8,'saida','Transporte','Passagens',120],[12,'saida','Lazer','Cinema e lanche',90],[22,'saida','Lazer','Jogo e assinatura',70],[25,'saida','Outros','Presente',110]];
  for(var n=0;n<4;n++){var m=addM(hoje().slice(0,7),-n);T.forEach(function(t){var dia=Math.min(t[0],28);if(n===0&&m+'-'+pad(dia)>hoje())return;
    S.items.push({id:uid(),tipo:t[1],cat:t[2],desc:t[3],valor:Math.round(t[4]*(0.85+Math.random()*0.3)),data:m+'-'+pad(dia)})})}
  S.metas={'Mercado':700,'Lazer':200,'Transporte':200};save();mes=hoje().slice(0,7);R();toast('Dados de exemplo carregados.');
};

Object.keys(CATS).forEach(function(k){['#fCt','#fCat'].forEach(function(id){var o=document.createElement('option');o.value=k;o.textContent=k;$(id).appendChild(o)})});
var all=document.createElement('option');all.value='';all.textContent='Todas as categorias';$('#fCat').insertBefore(all,$('#fCat').firstChild);$('#fCat').value='';
R();
})();
</script>
</body>
